<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#E6007E"><title>Acceso cliente · Impulso Digital</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--m:#E6007E;--c:#F2385A;--o:#FF6A00;--i:#262626;--g:#F5F5F7;--l:#E4E4EA;--u:#666871;--d:#B42318;--grad:linear-gradient(135deg,var(--m),var(--c) 52%,var(--o))}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 12% 10%,rgba(230,0,126,.10),transparent 30%),radial-gradient(circle at 90% 90%,rgba(255,106,0,.10),transparent 30%),var(--g);font-family:'Montserrat',system-ui;color:var(--i)}main{width:min(450px,100%)}.brand{display:flex;align-items:center;gap:11px;margin-bottom:16px}.brand img{width:50px;height:50px;border-radius:50%;border:2px solid var(--m);object-fit:cover}.brand strong{font-family:'Anton';font-weight:400;font-size:1.35rem}.brand small{display:block;color:var(--m);font-size:10px;font-weight:800;letter-spacing:.1em}.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:27px;box-shadow:0 18px 55px rgba(38,38,38,.10)}h1{font-family:'Anton';font-size:2.15rem;font-weight:400;margin:0 0 7px}.lead{color:var(--u);line-height:1.55;font-size:13px;margin-bottom:22px}label{display:block;font-size:12px;font-weight:800;margin:13px 0 6px}input{width:100%;border:1px solid var(--l);border-radius:11px;padding:12px;font:inherit;outline:none}input:focus{border-color:var(--m);box-shadow:0 0 0 3px rgba(230,0,126,.09)}.pw{position:relative}.pw input{padding-right:48px}.eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;cursor:pointer}.submit{width:100%;border:0;border-radius:11px;padding:12px 14px;margin-top:18px;background:var(--grad);color:#fff;font:inherit;font-weight:800;cursor:pointer}.submit:disabled{opacity:.55}.status{display:none;margin-top:14px;border:1px solid #F0C7C3;background:#FFF1F0;color:var(--d);padding:10px 11px;border-radius:10px;font-size:12px;line-height:1.45}.foot{text-align:center;color:var(--u);font-size:10px;margin-top:14px}</style></head><body><main><div class="brand"><img src="./img/logo-impulso-digital.png" alt="Impulso Digital"><span><strong>IMPULSO DIGITAL</strong><small>PORTAL CLIENTE</small></span></div><section class="card"><h1>Activa tu negocio</h1><p class="lead">Inicia sesión para ver tu demo, configuración, límites y estado de activación. RLS decide qué empresas puede ver esta sesión.</p><form id="form"><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><div class="pw"><input id="password" type="password" autocomplete="current-password" required><button class="eye" id="eye" type="button" aria-label="Mostrar contraseña">👁</button></div><button class="submit" id="btn" type="submit">Entrar al panel</button></form><div class="status" id="status"></div></section><p class="foot">DESARROLLO · No contiene credenciales privadas.</p></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm';const sb=createClient('https://xnlzsgulskqyecfgzhwa.supabase.co','sb_publishable_s9YdJaMe_ll4QehPkADlKQ_KkuvWt32',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),form=document.getElementById('form'),btn=document.getElementById('btn'),pw=document.getElementById('password'),eye=document.getElementById('eye'),status=document.getElementById('status');function fail(m=''){status.textContent=m;status.style.display=m?'block':'none'}async function validate(){const{data:m,error}=await sb.from('usuarios_negocio').select('negocio_id,rol,created_at').order('created_at');if(error)throw error;if(!m||m.length<1)throw new Error('La sesión no tiene ningún negocio autorizado.');const saved=localStorage.getItem('impulso_negocio_activo');const allowed=saved&&m.some(x=>String(x.negocio_id)===String(saved));if(!allowed)localStorage.setItem('impulso_negocio_activo',String(m[0].negocio_id));location.replace('./cliente-panel.html')}eye.onclick=()=>{pw.type=pw.type==='password'?'text':'password';eye.textContent=pw.type==='password'?'👁':'🙈'};form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;fail('');try{const{error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:pw.value});if(error)throw new Error('Correo o contraseña inválidos.');await validate()}catch(err){fail(err?.message||'No se pudo iniciar sesión.');btn.disabled=false}};const{data:{session}}=await sb.auth.getSession();if(session?.user){try{await validate()}catch(err){fail(err?.message||'No se pudo validar la sesión.')}};</script></body></html>
