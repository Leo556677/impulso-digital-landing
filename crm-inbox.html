<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#E6007E">
<title>Conversaciones · Impulso Digital</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f6f8;color:#25252a;font-family:system-ui,sans-serif}.box{max-width:520px;margin:24px;padding:24px;background:#fff;border:1px solid #e4e4ea;border-radius:18px;text-align:center;box-shadow:0 16px 44px rgba(28,28,33,.08)}.dot{width:32px;height:32px;margin:0 auto 14px;border:4px solid #eee;border-top-color:#e6007e;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}a{color:#e6007e;font-weight:700}</style>
</head>
<body><div class="box"><div class="dot"></div><strong>Cargando conversaciones…</strong><p id="msg">Preparando el CRM de la empresa activa.</p></div>
<script>
/* TEMPORAL: loader del CRM comprimido. Reemplazar por módulos HTML/JS directos al refactorizar. */
(async()=>{const m=document.getElementById('msg');try{if(typeof DecompressionStream!=='function')throw new Error('Este navegador no soporta la carga comprimida del CRM.');const r=await fetch('./crm-inbox.payload.gz?v=d625473c',{cache:'no-store'});if(!r.ok)throw new Error('No pudimos descargar el CRM.');const stream=r.body.pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){console.error(e);m.innerHTML='No pudimos cargar Conversaciones. <a href="./cliente-panel.html">Volver a mi panel</a>';}})();
</script></body></html>
