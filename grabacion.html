<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#111827"><title>Sesión de grabación · Dr. Olano</title><style>
:root{--bg:#f5f6f8;--surface:#fff;--text:#15171a;--muted:#6b7280;--line:#e5e7eb;--dark:#111827;--success:#15803d;--successbg:#ecfdf3;--warn:#a16207;--warnbg:#fefce8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:90px}header{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(229,231,235,.85);padding:16px 18px}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;background:var(--dark);color:#fff;border-radius:13px;display:grid;place-items:center;font-weight:900}.brand h1{font-size:17px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:2px}main{padding:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(17,24,39,.05)}.hero{padding:18px;margin-bottom:14px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.eyebrow{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.08em}.hero h2{font-size:24px;line-height:1.1;margin:7px 0}.muted{color:var(--muted)}.small{font-size:12px}.progress{height:10px;background:#eceff3;border-radius:999px;overflow:hidden;margin:14px 0 8px}.progress span{display:block;height:100%;background:var(--dark)}.list{display:grid;gap:11px}.video{padding:16px;cursor:pointer}.video h3{font-size:16px;margin:6px 0}.status{font-size:10px;font-weight:900;padding:7px 9px;border-radius:999px;white-space:nowrap}.status.GRABADO{background:var(--successbg);color:var(--success)}.status.PENDIENTE,.status.GRABANDO{background:var(--warnbg);color:var(--warn)}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{font-size:10px;padding:6px 8px;background:#f0f2f5;border-radius:999px;color:#374151;font-weight:700}.view{display:none}.view.active{display:block}.back{border:0;background:transparent;font-weight:800;padding:8px 0 12px;cursor:pointer}.detail-hero{padding:18px;margin-bottom:12px}.detail-hero h2{margin:8px 0;font-size:24px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:850;cursor:pointer}.btn.primary{background:var(--dark);color:#fff}.btn.success{background:#dcfce7;color:#166534}.btn.secondary{background:#eef0f3;color:#111827}.shot{padding:15px;margin-bottom:11px}.shot-head{display:flex;justify-content:space-between;gap:10px}.shot-title{font-weight:900}.reference{margin:13px 0;border-radius:15px;overflow:hidden;background:#111827;min-height:190px;display:grid;place-items:center;color:#fff;position:relative}.reference img{width:100%;height:auto;display:block}.frame{width:72%;height:130px;border:2px solid rgba(255,255,255,.72);border-radius:15px;position:relative}.head{width:50px;height:50px;border:3px solid #fff;border-radius:50%;position:absolute;left:50%;top:18%;transform:translateX(-50%)}.body{width:105px;height:70px;border:3px solid #fff;border-bottom:0;border-radius:60px 60px 0 0;position:absolute;left:50%;top:53%;transform:translateX(-50%)}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info>div{background:#f7f7f8;border-radius:11px;padding:10px}.info b,.label{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}.say{border-left:4px solid var(--dark);background:#fafafa;border-radius:0 12px 12px 0;padding:13px 14px;margin-top:11px;font-size:18px;line-height:1.5}.note{margin-top:10px;font-size:12px;background:#fff8e8;border-radius:11px;padding:10px;color:#6d4c00}.empty{padding:44px 18px;text-align:center;color:var(--muted)}.tele{position:fixed;inset:0;background:#050505;color:#fff;z-index:100;display:none;overflow:auto}.tele.active{display:block}.tele-inner{max-width:850px;margin:auto;padding:18px 20px 110px}.tele-top{position:sticky;top:0;background:rgba(5,5,5,.94);backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;padding:10px 0 16px}.tele p{font-size:clamp(30px,6vw,56px);line-height:1.38;font-weight:750;margin:42px 0}.tele button{background:#fff;border:0;border-radius:11px;padding:10px 13px;font-weight:850}.error{margin:60px 18px;padding:22px;text-align:center}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:12px 15px;border-radius:12px;font-weight:750;font-size:12px;opacity:0;transition:.2s;z-index:120}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:640px){main{padding:12px}.info{grid-template-columns:1fr}.actions .btn{flex:1}.reference{min-height:160px}}
</style></head><body><div class="app"><header><div class="brand"><div class="logo">DO</div><div><h1>Dr. Olano · Centro de Producción</h1><div class="sub">Guía de grabación</div></div></div></header><main><section id="home" class="view active"><div id="sessionHero" class="card hero"><div class="muted">Cargando sesión…</div></div><div id="videos" class="list"></div></section><section id="detail" class="view"><button class="back" id="backBtn">← Volver a la sesión</button><div id="detailHero" class="card detail-hero"></div><div id="shots"></div></section></main></div><div id="tele" class="tele"><div class="tele-inner"><div class="tele-top"><div><div class="small" style="color:#9ca3af">TELEPROMPTER</div><b id="teleTitle"></b></div><button id="closeTele">Cerrar</button></div><div id="teleText"></div></div></div><div id="toast" class="toast"></div>
<script>
const API='https://xnlzsgulskqyecfgzhwa.supabase.co/functions/v1/content-recording-session';const KEY='sb_publishable_s9YdJaMe_ll4QehPkADlKQ_KkuvWt32';const token=new URLSearchParams(location.search).get('token')||'';let state=null,current=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,token,...extra})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.message||'No se pudo cargar la sesión.');return d}function fmtDate(v){return v?new Intl.DateTimeFormat('es-PE',{weekday:'long',day:'2-digit',month:'long'}).format(new Date(v+'T12:00:00')):'Fecha por definir'}function renderHome(){const {session,items}=state,done=items.filter(x=>x.estado==='GRABADO').length,pct=items.length?Math.round(done/items.length*100):0;$('sessionHero').innerHTML=`<div class="row"><div><div class="eyebrow">SESIÓN DE GRABACIÓN</div><h2>${esc(session.nombre)}</h2><div class="small muted">${esc(fmtDate(session.fecha))}${session.lugar?` · ${esc(session.lugar)}`:''}</div></div><span class="chip">🎬 ${items.length} videos</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="small muted"><b>${done} de ${items.length}</b> grabados</div>${session.notas?`<div class="note"><b>Preparación:</b><br>${esc(session.notas)}</div>`:''}`;$('videos').innerHTML=items.length?items.map((x,i)=>`<article class="card video" data-id="${x.session_piece_id}"><div class="row"><div><div class="eyebrow">VIDEO ${String(i+1).padStart(2,'0')} · ${esc(x.pieza.content_code)}</div><h3>${esc(x.pieza.titulo||x.pieza.tema||x.pieza.servicio)}</h3><div class="small muted">${esc(x.pieza.servicio)}</div></div><span class="status ${esc(x.estado)}">${x.estado==='GRABADO'?'✓ GRABADO':'POR GRABAR'}</span></div><div class="meta">${x.pieza.duracion_seg?`<span class="chip">⏱ ${x.pieza.duracion_seg}s</span>`:''}${x.pieza.formato?`<span class="chip">🎥 ${esc(x.pieza.formato)}</span>`:''}<span class="chip">🎬 ${x.tomas.filter(t=>t.tipo==='PRINCIPAL').length} tomas</span></div></article>`).join(''):'<div class="card empty">Esta sesión aún no tiene videos.</div>';document.querySelectorAll('.video').forEach(el=>el.onclick=()=>openVideo(el.dataset.id))}function openVideo(id){current=state.items.find(x=>x.session_piece_id===id);if(!current)return;$('home').classList.remove('active');$('detail').classList.add('active');renderDetail();scrollTo(0,0)}function renderDetail(){const x=current,p=x.pieza;$('detailHero').innerHTML=`<div class="row"><div><div class="eyebrow">${esc(p.content_code)} · ${esc(p.servicio)}</div><h2>${esc(p.titulo||p.tema||p.servicio)}</h2><div class="small muted">${p.duracion_seg?`Duración aprox. ${p.duracion_seg}s`:''}${p.formato?` · ${esc(p.formato)}`:''}</div></div><span class="status ${esc(x.estado)}">${x.estado==='GRABADO'?'✓ GRABADO':'POR GRABAR'}</span></div>${x.notas_equipo?`<div class="note">${esc(x.notas_equipo)}</div>`:''}<div class="actions"><button id="teleBtn" class="btn primary">🎤 Teleprompter</button><button id="recordBtn" class="btn success">${x.estado==='GRABADO'?'↩ Volver a pendiente':'✓ Marcar grabado'}</button></div>`;$('teleBtn').onclick=openTele;$('recordBtn').onclick=toggleRecorded;const principal=x.tomas.filter(t=>t.tipo==='PRINCIPAL'),broll=x.tomas.filter(t=>t.tipo==='BROLL');let html='';if(principal.length)html+=principal.map((s,i)=>shotHtml(s,i+1)).join('');else html+=`<article class="card shot"><div class="shot-title">Guion</div><div class="say">${esc(p.master_script||p.hook_verbal||'')}</div><div class="note">El mapa de planos todavía no fue cargado.</div></article>`;if(broll.length)html+=`<div class="eyebrow" style="margin:20px 4px 9px">B-ROLL NECESARIO</div>`+broll.map((s,i)=>shotHtml(s,i+1,true)).join('');$('shots').innerHTML=html}function shotHtml(s,n,b=false){return`<article class="card shot"><div class="shot-head"><div><div class="shot-title">${b?'B-ROLL':'TOMA'} ${n}${s.plano_id?` · ${esc(s.plano_id)}`:''}</div><div class="small muted">${esc(s.tiempo||'')}</div></div>${s.tipo_plano?`<span class="chip">${esc(s.tipo_plano)}</span>`:''}</div><div class="reference">${s.reference_url?`<img src="${esc(s.reference_url)}" alt="Referencia de toma" loading="lazy">`:'<div class="frame"><div class="head"></div><div class="body"></div></div>'}</div><div class="info">${s.camara?`<div><b>Plano / cámara</b>${esc(s.camara)}</div>`:''}${s.accion?`<div><b>Qué hace</b>${esc(s.accion)}</div>`:''}${s.que_se_ve?`<div><b>Qué se ve</b>${esc(s.que_se_ve)}</div>`:''}${s.movimiento?`<div><b>Movimiento</b>${esc(s.movimiento)}</div>`:''}</div>${s.que_se_dice?`<div class="label" style="margin-top:12px">DICE</div><div class="say">${esc(s.que_se_dice)}</div>`:''}${s.texto_pantalla?`<div class="note"><b>Texto en pantalla:</b> ${esc(s.texto_pantalla)}</div>`:''}</article>`}async function toggleRecorded(){try{const next=current.estado==='GRABADO'?'PENDIENTE':'GRABADO';await api('mark_piece',{session_piece_id:current.session_piece_id,estado:next});current.estado=next;if(next==='GRABADO')current.grabado_at=new Date().toISOString();renderDetail();renderHome();toast(next==='GRABADO'?'Video marcado como grabado ✓':'Video volvió a pendiente')}catch(e){toast(e.message)}}function openTele(){const p=current.pieza,lines=current.tomas.filter(t=>t.tipo==='PRINCIPAL'&&t.que_se_dice).map(t=>t.que_se_dice);$('teleTitle').textContent=p.titulo||p.content_code;$('teleText').innerHTML=(lines.length?lines:[p.master_script||p.hook_verbal||'']).map(t=>`<p>${esc(t)}</p>`).join('');$('tele').classList.add('active');document.body.style.overflow='hidden'}$('closeTele').onclick=()=>{$('tele').classList.remove('active');document.body.style.overflow=''};$('backBtn').onclick=()=>{$('detail').classList.remove('active');$('home').classList.add('active');current=null;renderHome();scrollTo(0,0)};async function init(){try{state=await api('session_get');renderHome()}catch(e){document.querySelector('main').innerHTML=`<div class="card error"><h2>No pudimos abrir la sesión</h2><p class="muted">${esc(e.message)}</p><p class="small muted">Pide a Impulso Digital un nuevo enlace.</p></div>`}}init();
</script></body></html>
