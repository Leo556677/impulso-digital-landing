<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#E6007E" />
  <title>OAuth Callback · Impulso Digital</title>
  <style>
    :root{--magenta:#E6007E;--coral:#F2385A;--orange:#FF6A00;--charcoal:#262626;--gray:#F5F5F7;--muted:#666871;--ok:#16794c;--danger:#C62828;--gradient:linear-gradient(135deg,var(--magenta),var(--coral),var(--orange))}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--gray);color:var(--charcoal);font-family:Montserrat,system-ui,sans-serif}.card{width:min(620px,100%);background:#fff;border:1px solid #ECECF0;border-radius:22px;padding:28px;box-shadow:0 18px 55px rgba(38,38,38,.10)}.bar{width:54px;height:4px;border-radius:99px;background:var(--gradient);margin-bottom:18px}h1{margin:0 0 10px;font-size:1.7rem}.muted{color:var(--muted);line-height:1.6}.ok{color:var(--ok);font-weight:800}.danger{color:var(--danger);font-weight:800}pre{white-space:pre-wrap;word-break:break-word;background:#262626;color:#fff;border-radius:14px;padding:16px;margin-top:16px;min-height:80px}
  </style>
</head>
<body>
  <main class="card">
    <div class="bar"></div>
    <h1>Impulso Digital</h1>
    <p id="status" class="muted">Procesando respuesta segura de Meta…</p>
    <pre id="result" hidden></pre>
  </main>
  <script>
(function(){
  'use strict';

  const ORIGIN='https://leo556677.github.io';
  const CHANNEL='impulso-meta-oauth';
  const BUSINESS_CONTEXT_KEY='impulso_business_management_oauth_context';
  const EXISTING_WABA_CONTEXT_KEY='impulso_existing_waba_oauth_context';
  const EXISTING_WABA_RESULT_KEY='impulso_existing_waba_oauth_result';
  const SUPABASE_URL='https://xnlzsgulskqyecfgzhwa.supabase.co';
  const SUPABASE_KEY='sb_publishable_s9YdJaMe_ll4QehPkADlKQ_KkuvWt32';
  const AUTH_KEY='sb-xnlzsgulskqyecfgzhwa-auth-token';

  const params=new URLSearchParams(location.search);
  const payload={
    type:'IMPULSO_META_OAUTH_CALLBACK',
    code:params.get('code'),
    state:params.get('state'),
    error:params.get('error'),
    error_reason:params.get('error_reason'),
    error_description:params.get('error_description')
  };

  const status=document.getElementById('status');
  const result=document.getElementById('result');

  function showResult(value){
    result.hidden=false;
    result.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);
  }

  function broadcast(message){
    try{if(window.opener)window.opener.postMessage(message,ORIGIN)}catch(_){}
    try{
      const bc=new BroadcastChannel(CHANNEL);
      bc.postMessage(message);
      setTimeout(()=>bc.close(),1500);
    }catch(_){}
  }

  function storedAccessToken(){
    try{
      const raw=localStorage.getItem(AUTH_KEY);
      if(!raw)return '';
      const parsed=JSON.parse(raw);
      const candidates=[
        parsed,
        parsed&&parsed.currentSession,
        parsed&&parsed.session,
        parsed&&parsed.data&&parsed.data.session
      ].filter(Boolean);
      const session=candidates.find(x=>typeof x.access_token==='string'&&x.access_token.length>20);
      return session?String(session.access_token):'';
    }catch(_){return ''}
  }

  async function invokeEdge(slug,body){
    const token=storedAccessToken();
    if(!token)return {ok:false,error:'SESION_PORTAL_NO_DISPONIBLE'};
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),15000);
    try{
      const resp=await fetch(SUPABASE_URL+'/functions/v1/'+slug,{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'apikey':SUPABASE_KEY,
          'Authorization':'Bearer '+token
        },
        body:JSON.stringify(body),
        cache:'no-store',
        signal:controller.signal
      });
      let data=null;
      try{data=await resp.json()}catch(_){}
      if(!resp.ok)return data||{ok:false,error:'HTTP_'+resp.status};
      return data||{ok:false,error:'RESPUESTA_VACIA'};
    }catch(e){
      return {ok:false,error:e&&e.name==='AbortError'?'TIMEOUT_BACKEND':String(e&&e.message||e)};
    }finally{
      clearTimeout(timer);
    }
  }

  function getContext(key){
    try{
      const raw=localStorage.getItem(key);
      return raw?JSON.parse(raw):null;
    }catch(_){return null}
  }

  const businessContext=getContext(BUSINESS_CONTEXT_KEY);
  const existingWabaContext=getContext(EXISTING_WABA_CONTEXT_KEY);

  const isBusinessReview=Boolean(
    payload.state &&
    businessContext &&
    businessContext.state===payload.state &&
    /^[0-9a-fA-F-]{36}$/.test(String(businessContext.negocio_id||'')) &&
    Number.isFinite(Number(businessContext.created_at)) &&
    Date.now()-Number(businessContext.created_at)>=0 &&
    Date.now()-Number(businessContext.created_at)<=10*60*1000
  );

  const isExistingWaba=Boolean(
    payload.state &&
    existingWabaContext &&
    existingWabaContext.state===payload.state &&
    /^[0-9a-fA-F-]{36}$/.test(String(existingWabaContext.negocio_id||'')) &&
    /^[0-9]{6,30}$/.test(String(existingWabaContext.waba_id||'')) &&
    Number.isFinite(Number(existingWabaContext.created_at)) &&
    Date.now()-Number(existingWabaContext.created_at)>=0 &&
    Date.now()-Number(existingWabaContext.created_at)<=10*60*1000
  );

  async function main(){
    if(isExistingWaba){
      localStorage.removeItem(EXISTING_WABA_CONTEXT_KEY);
      let finalData=null;

      if(payload.error){
        finalData={ok:false,error:payload.error,detalle:payload.error_description||payload.error_reason||null};
      }else if(!payload.code){
        finalData={ok:false,error:'META_SIN_CODIGO'};
      }else{
        status.textContent='Autorización recibida. Validando WABA y número corporativo en backend seguro…';
        finalData=await invokeEdge('whatsapp-prod-subscribe-app',{
          mode:'CLIENT_EXISTING_WABA_AUTHORIZE',
          negocio_id:String(existingWabaContext.negocio_id),
          waba_id:String(existingWabaContext.waba_id),
          code:String(payload.code)
        });
      }

      try{
        localStorage.setItem(EXISTING_WABA_RESULT_KEY,JSON.stringify({at:Date.now(),result:finalData}));
      }catch(_){}

      if(finalData&&finalData.ok===true){
        status.innerHTML='<span class="ok">Autorización validada.</span> Regresando a la activación del número corporativo…';
      }else{
        status.innerHTML='<span class="danger">La autorización no pudo completarse.</span> Regresando con el detalle…';
      }
      showResult(finalData);

      const next='./cliente-whatsapp-existing-waba-prod.html?negocio='+encodeURIComponent(String(existingWabaContext.negocio_id))+'&oauth_return=1&v=20261004-10';
      setTimeout(()=>location.replace(next),1300);
      return;
    }

    if(isBusinessReview){
      localStorage.removeItem(BUSINESS_CONTEXT_KEY);

      let finalData=null;
      if(payload.error){
        finalData={ok:false,error:payload.error,detalle:payload.error_description||payload.error_reason||null};
      }else if(!payload.code){
        finalData={ok:false,error:'META_SIN_CODIGO'};
      }else{
        status.textContent='Autorización recibida. Validando Business Portfolio en backend seguro…';
        finalData=await invokeEdge('business-management-review',{
          negocio_id:String(businessContext.negocio_id),
          code:String(payload.code)
        });
      }

      if(finalData&&finalData.ok===true){
        status.innerHTML='<span class="ok">Autorización validada correctamente.</span> Puedes volver a la ventana de Impulso Digital.';
      }else{
        status.innerHTML='<span class="danger">La autorización llegó, pero la validación backend no se completó.</span>';
      }
      showResult(finalData);
      broadcast({type:'IMPULSO_BUSINESS_REVIEW_RESULT',state:payload.state,result:finalData});
      return;
    }

    broadcast(payload);
    if(payload.code)status.textContent='Autorización recibida. Puedes volver a la ventana de Impulso Digital.';
    else if(payload.error)status.textContent='Meta devolvió un error de autorización. Puedes volver a la ventana anterior.';
    else status.textContent='Meta no devolvió un código de autorización. Puedes volver a la ventana anterior.';
    setTimeout(()=>{try{window.close()}catch(_){}},1200);
  }

  main().catch(e=>{
    const safe={ok:false,error:String(e&&e.message||e)};
    status.innerHTML='<span class="danger">No se pudo procesar la autorización.</span>';
    showResult(safe);
  });
})();
</script>
</body>
</html>
