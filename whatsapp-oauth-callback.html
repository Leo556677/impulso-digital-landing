<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#E6007E" />
  <title>OAuth Callback · Impulso Digital</title>
  <style>
    :root{--magenta:#E6007E;--coral:#F2385A;--orange:#FF6A00;--charcoal:#262626;--gray:#F5F5F7;--muted:#666871;--ok:#16794c;--danger:#C62828;--gradient:linear-gradient(135deg,var(--magenta),var(--coral),var(--orange))}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--gray);color:var(--charcoal);font-family:Montserrat,system-ui,sans-serif}.card{width:min(620px,100%);background:#fff;border:1px solid #ECECF0;border-radius:22px;padding:28px;box-shadow:0 18px 55px rgba(38,38,38,.10)}.bar{width:54px;height:4px;border-radius:99px;background:var(--gradient);margin-bottom:18px}h1{margin:0 0 10px;font-size:1.7rem}.muted{color:var(--muted);line-height:1.6}.ok{color:var(--ok);font-weight:800}.danger{color:var(--danger);font-weight:800}pre{white-space:pre-wrap;word-break:break-word;background:#262626;color:#fff;border-radius:14px;padding:16px;margin-top:16px;min-height:80px}
  </style>
</head>
<body>
  <main class="card">
    <div class="bar"></div>
    <h1>Impulso Digital</h1>
    <p id="status" class="muted">Procesando respuesta segura de Meta…</p>
    <pre id="result" hidden></pre>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm';

    const ORIGIN = 'https://leo556677.github.io';
    const CHANNEL = 'impulso-meta-oauth';
    const BUSINESS_CONTEXT_KEY = 'impulso_business_management_oauth_context';
    const SUPABASE_URL = 'https://xnlzsgulskqyecfgzhwa.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_s9YdJaMe_ll4QehPkADlKQ_KkuvWt32';
    const params = new URLSearchParams(window.location.search);
    const payload = {
      type: 'IMPULSO_META_OAUTH_CALLBACK',
      code: params.get('code'),
      state: params.get('state'),
      error: params.get('error'),
      error_reason: params.get('error_reason'),
      error_description: params.get('error_description')
    };

    const status = document.getElementById('status');
    const result = document.getElementById('result');

    function showResult(value) {
      result.hidden = false;
      result.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
    }

    function broadcast(message) {
      try { if (window.opener) window.opener.postMessage(message, ORIGIN); } catch (_) {}
      try {
        const bc = new BroadcastChannel(CHANNEL);
        bc.postMessage(message);
        setTimeout(() => bc.close(), 1500);
      } catch (_) {}
    }

    let businessContext = null;
    try {
      const raw = localStorage.getItem(BUSINESS_CONTEXT_KEY);
      if (raw) businessContext = JSON.parse(raw);
    } catch (_) {}

    const isBusinessReview = Boolean(
      payload.state &&
      businessContext?.state === payload.state &&
      /^[0-9a-fA-F-]{36}$/.test(String(businessContext?.negocio_id || '')) &&
      Number.isFinite(Number(businessContext?.created_at)) &&
      Date.now() - Number(businessContext.created_at) >= 0 &&
      Date.now() - Number(businessContext.created_at) <= 10 * 60 * 1000
    );

    if (isBusinessReview) {
      localStorage.removeItem(BUSINESS_CONTEXT_KEY);

      if (payload.error) {
        status.innerHTML = '<span class="danger">Meta devolvió un error de autorización.</span>';
        const safeError = { ok:false, error:payload.error, detalle:payload.error_description || payload.error_reason || null };
        showResult(safeError);
        broadcast({ type:'IMPULSO_BUSINESS_REVIEW_RESULT', state:payload.state, result:safeError });
      } else if (!payload.code) {
        status.innerHTML = '<span class="danger">Meta no devolvió un código de autorización.</span>';
        const safeError = { ok:false, error:'META_SIN_CODIGO' };
        showResult(safeError);
        broadcast({ type:'IMPULSO_BUSINESS_REVIEW_RESULT', state:payload.state, result:safeError });
      } else {
        status.textContent = 'Autorización recibida. Validando Business Portfolio en backend seguro…';
        try {
          const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
            auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}
          });
          const { data, error } = await supabase.functions.invoke('business-management-review', {
            body:{ negocio_id:String(businessContext.negocio_id), code:String(payload.code) }
          });

          let finalData = data;
          if (error) {
            let detail = null;
            try { if (error.context && typeof error.context.json === 'function') detail = await error.context.json(); } catch (_) {}
            finalData = detail || { ok:false, error:error.message || 'No se pudo completar la validación.' };
          }

          if (finalData?.ok === true) status.innerHTML = '<span class="ok">Autorización validada correctamente.</span> Puedes volver a la ventana de Impulso Digital.';
          else status.innerHTML = '<span class="danger">La autorización llegó, pero la validación backend no se completó.</span>';
          showResult(finalData);
          broadcast({ type:'IMPULSO_BUSINESS_REVIEW_RESULT', state:payload.state, result:finalData });
        } catch (error) {
          const safeError = { ok:false, error:error?.message || 'No se pudo completar la validación backend.' };
          status.innerHTML = '<span class="danger">No se pudo completar la validación backend.</span>';
          showResult(safeError);
          broadcast({ type:'IMPULSO_BUSINESS_REVIEW_RESULT', state:payload.state, result:safeError });
        }
      }
    } else {
      broadcast(payload);
      if (payload.code) status.textContent = 'Autorización recibida. Puedes volver a la ventana de Impulso Digital.';
      else if (payload.error) status.textContent = 'Meta devolvió un error de autorización. Puedes volver a la ventana anterior.';
      else status.textContent = 'Meta no devolvió un código de autorización. Puedes volver a la ventana anterior.';
      setTimeout(() => window.close(), 1200);
    }
  </script>
</body>
</html>
