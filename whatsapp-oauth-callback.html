<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#E6007E" />
  <title>OAuth Callback · Impulso Digital</title>
  <style>
    :root{--magenta:#E6007E;--coral:#F2385A;--orange:#FF6A00;--charcoal:#262626;--gray:#F5F5F7;--muted:#666871;--gradient:linear-gradient(135deg,var(--magenta),var(--coral),var(--orange))}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--gray);color:var(--charcoal);font-family:Montserrat,system-ui,sans-serif}.card{width:min(520px,100%);background:#fff;border:1px solid #ECECF0;border-radius:22px;padding:28px;box-shadow:0 18px 55px rgba(38,38,38,.10)}.bar{width:54px;height:4px;border-radius:99px;background:var(--gradient);margin-bottom:18px}h1{margin:0 0 10px;font-size:1.7rem}.muted{color:var(--muted);line-height:1.6}
  </style>
</head>
<body>
  <main class="card">
    <div class="bar"></div>
    <h1>Impulso Digital</h1>
    <p id="status" class="muted">Procesando respuesta segura de Meta…</p>
  </main>
  <script>
    const ORIGIN = 'https://leo556677.github.io';
    const params = new URLSearchParams(window.location.search);
    const payload = {
      type: 'IMPULSO_META_OAUTH_CALLBACK',
      code: params.get('code'),
      state: params.get('state'),
      error: params.get('error'),
      error_reason: params.get('error_reason'),
      error_description: params.get('error_description')
    };

    const status = document.getElementById('status');
    if (!window.opener) {
      status.textContent = 'No se encontró la ventana de origen. Cierra esta ventana y vuelve a iniciar desde la página DEV.';
    } else {
      window.opener.postMessage(payload, ORIGIN);
      status.textContent = payload.code
        ? 'Autorización recibida. Puedes volver a la ventana de Impulso Digital.'
        : 'Meta no devolvió un código de autorización. Puedes volver a la ventana anterior.';
      setTimeout(() => window.close(), 900);
    }
  </script>
</body>
</html>
