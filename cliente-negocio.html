<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Datos de mi negocio · Impulso Digital</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--p:#E6007E;--o:#FF6A00;--ink:#25252A;--m:#676B78;--bg:#F6F6F8;--line:#E4E4EA;--ok:#147A42;--danger:#B42318;--grad:linear-gradient(135deg,var(--p),#F2385A 52%,var(--o))}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif}.top{background:#fff;border-bottom:1px solid var(--line)}.topin,.wrap{width:min(760px,calc(100% - 24px));margin:auto}.topin{min-height:66px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:9px;align-items:center;text-decoration:none;color:var(--ink)}.brand img{width:40px;height:40px;border-radius:50%}.brand strong,h1{font-family:Anton,sans-serif;font-weight:400}.back{font-size:12px;font-weight:800;text-decoration:none;color:var(--p)}.wrap{margin-top:22px;margin-bottom:50px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 14px 40px rgba(30,30,35,.07)}h1{font-size:2.4rem;margin:0}.lead{color:var(--m);line-height:1.6;font-size:13px}.context{margin:14px 0;padding:11px 13px;border-radius:12px;background:#FFF5FA;border:1px solid #F0D8E5;font-size:11px;color:var(--m)}.context b{color:var(--ink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit}.full{grid-column:1/-1}.help{font-size:10px;color:var(--m);margin-top:5px}.btn{border:0;border-radius:11px;padding:12px 15px;background:var(--grad);color:#fff;font-weight:800;cursor:pointer}.actions{display:flex;gap:9px;margin-top:18px}.status{margin-top:14px;font-size:12px;color:var(--danger)}.status.ok{color:var(--ok)}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:18px}.actions{display:grid}.btn{width:100%}}
</style></head><body><header class="top"><div class="topin"><a id="brandLink" class="brand" href="./cliente-panel.html"><img src="./img/logo-impulso-digital.png" alt="Impulso Digital"><strong>IMPULSO DIGITAL</strong></a><a id="backLink" class="back" href="./cliente-panel.html">← Volver</a></div></header><main class="wrap"><section class="card"><div style="font-size:11px;color:var(--p);font-weight:800">PASO 1</div><h1>Datos de tu negocio</h1><p class="lead">Completa la información que usaremos para identificar tu empresa y mostrar horarios correctamente.</p><div id="context" class="context">Validando empresa activa…</div><form id="form"><div class="grid"><div class="full"><label for="nombre">Nombre comercial</label><input id="nombre" required maxlength="120"></div><div><label for="razon">Razón social</label><input id="razon" maxlength="180"></div><div><label for="ruc">RUC</label><input id="ruc" inputmode="numeric" maxlength="20"></div><div><label for="telefono">Teléfono del negocio</label><input id="telefono" placeholder="+51…" maxlength="30"><div class="help">Usa formato internacional cuando corresponda.</div></div><div><label for="zona">Zona horaria</label><input id="zona" required placeholder="America/Lima"><div class="help">Ejemplo: America/Lima.</div></div></div><div class="actions"><button id="save" class="btn" type="submit">Guardar y continuar</button></div></form><div id="status" class="status" aria-live="polite"></div></section></main><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm';const sb=createClient('https://xnlzsgulskqyecfgzhwa.supabase.co','sb_publishable_s9YdJaMe_ll4QehPkADlKQ_KkuvWt32',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});let negocioId=null,membership=null;const $=id=>document.getElementById(id),status=$('status');function msg(t,ok=false){status.textContent=t;status.className=`status ${ok?'ok':''}`}function panelHref(){return `./cliente-panel.html?negocio=${encodeURIComponent(negocioId)}`}
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.replace('./cliente-acceso.html');return}const{data:m,error:e}=await sb.from('usuarios_negocio').select('negocio_id,rol,created_at,negocios(nombre)').order('created_at');if(e||!m?.length)throw new Error('No pudimos identificar una empresa autorizada.');const params=new URLSearchParams(location.search),requested=params.get('negocio'),saved=localStorage.getItem('impulso_negocio_activo'),pick=id=>m.find(x=>String(x.negocio_id)===String(id));membership=pick(requested)||pick(saved)||m[0];negocioId=membership.negocio_id;localStorage.setItem('impulso_negocio_activo',String(negocioId));history.replaceState({},'',`${location.pathname}?negocio=${encodeURIComponent(negocioId)}`);$('brandLink').href=panelHref();$('backLink').href=panelHref();$('context').innerHTML=`Editando: <b>${String(membership.negocios?.nombre||'Mi negocio').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</b>`;if(!['admin','propietario'].includes(membership.rol))$('save').disabled=true;const{data:n,error:ne}=await sb.from('negocios').select('nombre,razon_social,ruc,telefono_e164,zona_horaria').eq('id',negocioId).single();if(ne)throw ne;$('nombre').value=n.nombre||'';$('razon').value=n.razon_social||'';$('ruc').value=n.ruc||'';$('telefono').value=n.telefono_e164||'';$('zona').value=n.zona_horaria||''}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(!membership||!['admin','propietario'].includes(membership.rol))return;$('save').disabled=true;msg('Guardando…',true);const payload={nombre:$('nombre').value.trim(),razon_social:$('razon').value.trim()||null,ruc:$('ruc').value.trim()||null,telefono_e164:$('telefono').value.trim()||null,zona_horaria:$('zona').value.trim()};const{error}=await sb.from('negocios').update(payload).eq('id',negocioId);if(error){msg(error.message);$('save').disabled=false;return}msg('Datos guardados. Volviendo a tu panel…',true);setTimeout(()=>location.replace(panelHref()),600)});try{await init()}catch(e){msg(e.message||'No pudimos cargar tus datos.')}
</script></body></html>
