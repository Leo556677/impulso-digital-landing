<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dr. Olano · Demo UX V4</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f8}
#appFrame{display:block;width:100%;height:100dvh;border:0;background:#f3f5f8}
</style>
</head>
<body>
<iframe id="appFrame" src="./doctor-contenido-demo.html?v=4" allow="fullscreen" allowfullscreen></iframe>
<script>
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  const win=frame.contentWindow, doc=frame.contentDocument;
  if(!win||!doc)return;

  const style=doc.createElement('style');
  style.textContent=`
  /* V4 audit patch */
  .tele-fade-top,.tele-fade-bottom{position:absolute;left:0;right:0;z-index:7;pointer-events:none;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
  .tele-fade-top{top:64px;height:33vh;background:linear-gradient(to bottom,#030405 0%,rgba(3,4,5,.99) 45%,rgba(3,4,5,.9) 70%,rgba(3,4,5,0) 100%)}
  .tele-fade-bottom{bottom:104px;height:33vh;background:linear-gradient(to top,#030405 0%,rgba(3,4,5,.99) 45%,rgba(3,4,5,.9) 70%,rgba(3,4,5,0) 100%)}
  .tele-line{opacity:.04!important;filter:blur(2.8px)!important}
  .tele-line.near{opacity:.20!important;filter:blur(1.15px)!important}
  .tele-line.active{opacity:1!important;filter:none!important;color:var(--yellow)!important;text-shadow:0 0 24px rgba(255,216,77,.16)}
  .tele-focus{z-index:8}
  .tele-panel{z-index:12;transition:bottom .28s ease}
  .tele-top{z-index:12}
  .tele.native-fullscreen{width:100vw;height:100dvh}
  .tele.native-fullscreen.fullscreen-toast-guard .tele-panel{bottom:max(132px,calc(env(safe-area-inset-bottom) + 124px))!important}
  .tele.native-fullscreen.fullscreen-toast-guard .tele-scroll{bottom:292px!important}
  .tele.native-fullscreen.fullscreen-toast-guard .tele-fade-bottom{bottom:292px!important}
  .tele.native-fullscreen.fullscreen-toast-guard .tele-focus{top:43%!important}
  .tele-panel{box-shadow:0 18px 55px rgba(0,0,0,.38)}
  .tele-ctl svg,.transport svg{pointer-events:none}
  `;
  doc.head.appendChild(style);

  const svgX=`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  const closeTop=doc.getElementById('closeTele'); if(closeTop) closeTop.innerHTML=svgX;
  const closeBottom=doc.getElementById('closeBottom'); if(closeBottom) closeBottom.innerHTML=svgX;

  const tele=doc.getElementById('tele'), fullBtn=doc.getElementById('fullBtn');
  let guardTimer=0;
  async function toggleFullscreen(){
    try{
      const isFull=!!(doc.fullscreenElement||doc.webkitFullscreenElement);
      if(!isFull){
        if(tele.requestFullscreen) await tele.requestFullscreen({navigationUI:'hide'});
        else if(tele.webkitRequestFullscreen) tele.webkitRequestFullscreen();
      }else{
        if(doc.exitFullscreen) await doc.exitFullscreen();
        else if(doc.webkitExitFullscreen) doc.webkitExitFullscreen();
      }
    }catch(e){console.warn('Fullscreen no disponible',e)}
  }
  if(fullBtn) fullBtn.onclick=toggleFullscreen;
  function syncFullscreen(){
    const on=!!(doc.fullscreenElement||doc.webkitFullscreenElement);
    tele.classList.toggle('native-fullscreen',on);
    fullBtn?.classList.toggle('active-clean',on);
    clearTimeout(guardTimer);
    if(on){
      tele.classList.add('fullscreen-toast-guard');
      guardTimer=setTimeout(()=>tele.classList.remove('fullscreen-toast-guard'),5400);
    }else tele.classList.remove('fullscreen-toast-guard');
    setTimeout(()=>win.updateFocus?.(),120);
  }
  doc.addEventListener('fullscreenchange',syncFullscreen);
  doc.addEventListener('webkitfullscreenchange',syncFullscreen);

  [doc.getElementById('closeTele'),doc.getElementById('closeBottom')].filter(Boolean).forEach(btn=>{
    btn.addEventListener('click',async()=>{
      clearTimeout(guardTimer);
      if(doc.fullscreenElement&&doc.exitFullscreen){try{await doc.exitFullscreen()}catch{}}
      else if(doc.webkitFullscreenElement&&doc.webkitExitFullscreen){try{doc.webkitExitFullscreen()}catch{}}
    });
  });

  const history=doc.getElementById('history');
  if(history){
    const originalHistory=history.innerHTML;
    const past=[
      {date:'08 SEP',title:'Contenido grabado · Semana 36',count:4,videos:[
        ['Naturalidad: qué significa realmente','Medicina estética','28 s'],
        ['Qué evaluamos antes de decidir un tratamiento','Toxina botulínica','32 s'],
        ['Cuidados simples antes de tu cita','Cuidado facial','25 s'],
        ['Tres dudas frecuentes antes de una evaluación','Consulta médica','30 s']]},
      {date:'01 SEP',title:'Contenido grabado · Semana 35',count:5,videos:[
        ['Cómo preparamos una evaluación','Medicina estética','31 s'],
        ['Lo que una evaluación sí debe resolver','Consulta médica','29 s'],
        ['Resultados naturales: qué buscamos','Medicina estética','34 s'],
        ['Cuándo conviene esperar antes de tratar','Criterio médico','27 s'],
        ['Qué traer a tu primera cita','Consulta médica','24 s']]}
    ];
    function svg(id){return `<svg class="icon"><use href="#${id}"/></svg>`}
    function bindHistory(){
      const buttons=history.querySelectorAll('.history-card .video-cta');
      buttons.forEach((b,i)=>b.onclick=()=>openPast(i));
    }
    function openPast(i){
      const s=past[i]; if(!s)return;
      history.innerHTML=`<button id="v4HistoryBack" class="back">${svg('i-chevron-left')}Volver al historial</button>
      <div class="card detail-hero"><div class="date-label">${s.date}</div><h2>${s.title}</h2><div class="history-meta">${svg('i-check')} Sesión completada · ${s.count} videos</div></div>
      <div class="section-head"><div><h2>Videos de esta sesión</h2><p>Cada pieza se conserva por separado</p></div></div>
      <div class="video-grid">${s.videos.map((v,n)=>`<article class="card video-card" style="cursor:default"><div class="video-ribbon"><span class="video-big-num">${n+1}</span><span class="video-of">DE ${s.count}</span><span class="status-pill ok">${svg('i-check')} Grabado</span></div><div class="video-body"><div class="video-index">${svg('i-camera')} VIDEO ${n+1}</div><h3>${v[0]}</h3><div class="video-meta"><span class="left">${v[1]}</span><span class="right">${svg('i-clock')} ${v[2]}</span></div></div></article>`).join('')}</div>`;
      history.querySelector('#v4HistoryBack').onclick=()=>{history.innerHTML=originalHistory;bindHistory();win.renderHistory?.();window.scrollTo(0,0)};
      window.scrollTo(0,0);
    }
    bindHistory();
  }
});
</script>
</body>
</html>
