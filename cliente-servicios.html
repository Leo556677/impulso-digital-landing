<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Mis servicios · Impulso Digital</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--p:#E6007E;--o:#FF6A00;--ink:#25252A;--m:#676B78;--bg:#F6F6F8;--line:#E4E4EA;--ok:#147A42;--danger:#B42318;--grad:linear-gradient(135deg,var(--p),#F2385A 52%,var(--o))}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif}.top{background:#fff;border-bottom:1px solid var(--line)}.topin,.wrap{width:min(900px,calc(100% - 24px));margin:auto}.topin{min-height:66px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:9px;align-items:center;text-decoration:none;color:var(--ink)}.brand img{width:40px;height:40px;border-radius:50%}.brand strong,h1{font-family:Anton,sans-serif;font-weight:400}.back{font-size:12px;font-weight:800;text-decoration:none;color:var(--p)}.wrap{margin-top:22px;margin-bottom:50px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 14px 40px rgba(30,30,35,.07)}h1{font-size:2.4rem;margin:0}.lead{color:var(--m);line-height:1.6;font-size:13px}.layout{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:88px;resize:vertical}.full{grid-column:1/-1}.help{font-size:10px;color:var(--m);margin-top:5px}.btn{border:0;border-radius:10px;padding:11px 13px;background:var(--grad);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.list{display:grid;gap:10px}.service{border:1px solid var(--line);border-radius:14px;padding:14px}.service-top{display:flex;align-items:start;justify-content:space-between;gap:10px}.service h3{margin:0;font-size:14px}.service p{margin:6px 0;color:var(--m);font-size:11px;line-height:1.5}.pill{padding:5px 8px;border-radius:99px;background:#EAF8EF;color:var(--ok);font-size:9px;font-weight:800}.pill.off{background:#F1F1F4;color:var(--m)}.status{margin-top:12px;font-size:12px;color:var(--danger)}.status.ok{color:var(--ok)}@media(max-width:760px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:18px}}
</style></head><body><header class="top"><div class="topin"><a class="brand" href="./cliente-panel.html"><img src="./img/logo-impulso-digital.png" alt="Impulso Digital"><strong>IMPULSO DIGITAL</strong></a><a class="back" href="./cliente-panel.html">← Volver</a></div></header><main class="wrap"><div style="font-size:11px;color:var(--p);font-weight:800">PASO 3</div><h1>Agrega tus servicios</h1><p class="lead">Escribe qué ofreces. La duración es importante para que la agenda pueda calcular horarios disponibles.</p><div class="layout"><section class="card"><h2 style="margin-top:0">Nuevo servicio</h2><form id="form"><div class="grid"><div class="full"><label for="nombre">Nombre del servicio</label><input id="nombre" required maxlength="160" placeholder="Ej. Consulta inicial"></div><div class="full"><label for="descripcion">Descripción</label><textarea id="descripcion" maxlength="1000" placeholder="Explica brevemente qué incluye"></textarea></div><div><label for="duracion">Duración en minutos</label><input id="duracion" type="number" min="1" step="1" required placeholder="60"></div><div><label for="precio">Precio en soles</label><input id="precio" type="number" min="0" step="0.01" placeholder="Opcional"><div class="help">Si no tienes un precio fijo, déjalo vacío.</div></div></div><button id="save" class="btn" type="submit" style="margin-top:14px;width:100%">Guardar servicio</button></form><div id="status" class="status"></div></section><section class="card"><h2 style="margin-top:0">Tus servicios</h2><div id="list" class="list"><span style="color:var(--m);font-size:12px">Cargando…</span></div></section></div></main><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm';const sb=createClient('https://xnlzsgulskqyecfgzhwa.supabase.co','sb_publishable_s9YdJaMe_ll4QehPkADlKQ_KkuvWt32',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);let negocioId=null,canEdit=false;function msg(t,ok=false){$('status').textContent=t;$('status').className=`status ${ok?'ok':''}`}
async function resolve(){const{data:{session}}=await sb.auth.getSession();if(!session){location.replace('./cliente-acceso.html');return false}const{data:m,error}=await sb.from('usuarios_negocio').select('negocio_id,rol');if(error||!m||m.length!==1)throw new Error('No pudimos identificar tu empresa.');negocioId=m[0].negocio_id;canEdit=['admin','propietario'].includes(m[0].rol);$('save').disabled=!canEdit;return true}
async function load(){const{data,error}=await sb.from('servicios').select('id,nombre,descripcion,duracion_min,precio_pen,activo').eq('negocio_id',negocioId).order('created_at',{ascending:true});if(error)throw error;const rows=data||[];$('list').innerHTML=rows.length?rows.map(s=>`<article class="service"><div class="service-top"><div><h3>${s.nombre}</h3><p>${s.descripcion||'Sin descripción'}${s.duracion_min?` · ${s.duracion_min} min`:''}${s.precio_pen!=null?` · S/${Number(s.precio_pen).toFixed(2)}`:''}</p></div><span class="pill ${s.activo?'':'off'}">${s.activo?'ACTIVO':'INACTIVO'}</span></div>${canEdit?`<button class="btn secondary toggle" data-id="${s.id}" data-active="${s.activo}" style="margin-top:8px">${s.activo?'Pausar':'Activar'}</button>`:''}</article>`).join(''):'<p style="color:var(--m);font-size:12px">Aún no agregaste servicios.</p>';document.querySelectorAll('.toggle').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;const{error}=await sb.from('servicios').update({activo:b.dataset.active!=='true'}).eq('id',b.dataset.id).eq('negocio_id',negocioId);if(error)msg(error.message);await load()}))}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(!canEdit)return;const dur=Number($('duracion').value),price=$('precio').value.trim();$('save').disabled=true;msg('Guardando…',true);const payload={negocio_id:negocioId,nombre:$('nombre').value.trim(),descripcion:$('descripcion').value.trim()||null,duracion_min:dur,precio_pen:price===''?null:Number(price),activo:true};const{error}=await sb.from('servicios').insert(payload);$('save').disabled=false;if(error){msg(error.message);return}e.target.reset();msg('Servicio guardado. Puedes agregar otro o volver al panel.',true);await load()});try{if(await resolve())await load()}catch(e){msg(e.message||'No pudimos cargar tus servicios.')}
</script></body></html>
