name: Integrar Metricool en Impulso Digital

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrar tracker y privacidad
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('script.js')
          s = script.read_text(encoding='utf-8')

          if "metricoolHash:" not in s:
              s = s.replace(
                  "  tiktokPixelId: 'D4PSPVRC77UDLT7UQ0N0',\n",
                  "  tiktokPixelId: 'D4PSPVRC77UDLT7UQ0N0',\n  metricoolHash: '3bcf3ef6292c032f388af90cb4b618b8',\n"
              )

          metricool_fn = "\n".join([
              "function loadMetricoolTracker() {",
              "  if (window.__impulsoMetricoolLoaded) return;",
              "  window.__impulsoMetricoolLoaded = true;",
              "  const tracker = document.createElement('script');",
              "  tracker.type = 'text/javascript';",
              "  tracker.async = true;",
              "  tracker.src = 'https://tracker.metricool.com/resources/be.js';",
              "  tracker.onload = () => {",
              "    try {",
              "      if (window.beTracker && typeof window.beTracker.t === 'function') {",
              "        window.beTracker.t({ hash: IMPULSO.metricoolHash });",
              "      }",
              "    } catch { /* no bloquear la web si Metricool no responde */ }",
              "  };",
              "  document.head.appendChild(tracker);",
              "}",
              "",
              ""
          ])

          if "function loadMetricoolTracker()" not in s:
              marker = "function enableAnalytics() {\n"
              if marker not in s:
                  raise SystemExit('No se encontró enableAnalytics en script.js')
              s = s.replace(marker, metricool_fn + marker)

          old_enable = "function enableAnalytics() {\n  analyticsEnabled = true;\n  loadMetaPixel();\n  loadTikTokPixel();\n}"
          new_enable = "function enableAnalytics() {\n  analyticsEnabled = true;\n  loadMetaPixel();\n  loadTikTokPixel();\n  loadMetricoolTracker();\n}"
          if old_enable in s:
              s = s.replace(old_enable, new_enable)

          script.write_text(s, encoding='utf-8')

          privacy = Path('privacidad.html')
          p = privacy.read_text(encoding='utf-8')
          github_li = "      <li><strong>GitHub Pages:</strong> como infraestructura de alojamiento de esta web estática.</li>\n"
          metricool_li = "      <li><strong>Metricool Software, S.L.:</strong> para medición agregada del tráfico web cuando aceptas analítica. El tracker de Metricool no instala cookies ni asigna identificadores únicos; según su documentación, utiliza la IP de forma transitoria para determinar país y página visualizada y no almacena esa IP.</li>\n"
          if "Metricool Software, S.L." not in p:
              p = p.replace(github_li, github_li + metricool_li)
          p = p.replace(
              "La landing no carga Meta Pixel ni TikTok Pixel antes de tu consentimiento.",
              "La landing no carga Meta Pixel, TikTok Pixel ni el tracker de Metricool antes de tu consentimiento."
          )
          p = p.replace(
              "su conservación técnica en Meta/TikTok depende de la configuración y políticas de esas plataformas.",
              "su conservación técnica en Meta/TikTok/Metricool depende de la configuración y políticas de esas plataformas."
          )
          p = p.replace(
              "<strong>Última actualización:</strong> 3 de septiembre de 2026.",
              "<strong>Última actualización:</strong> 10 de septiembre de 2026."
          )
          privacy.write_text(p, encoding='utf-8')

          final_s = script.read_text(encoding='utf-8')
          final_p = privacy.read_text(encoding='utf-8')
          required = [
              "3bcf3ef6292c032f388af90cb4b618b8",
              "https://tracker.metricool.com/resources/be.js",
              "loadMetricoolTracker();"
          ]
          missing = [x for x in required if x not in final_s]
          if missing:
              raise SystemExit('Faltan elementos Metricool en script.js: ' + ', '.join(missing))
          if "Metricool Software, S.L." not in final_p:
              raise SystemExit('Falta Metricool en privacidad.html')
          PY

      - name: Commit y push
        shell: bash
        run: |
          if git diff --quiet -- script.js privacidad.html; then
            echo "Metricool ya estaba integrado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js privacidad.html
          git commit -m "analytics: integrar Metricool con consentimiento y privacidad"
          git push origin main
