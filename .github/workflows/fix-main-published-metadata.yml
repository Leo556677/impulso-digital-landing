name: Fix published metadata and legal footer

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply canonical and footer fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://impulso-digital-landing.vercel.app', 'https://leo556677.github.io/impulso-digital-landing')
          old = '<span>Privacidad: pendiente de datos legales finales</span><span>Términos: pendiente de datos legales finales</span>'
          new = '<a href="./privacidad.html">Privacidad</a><a href="./terminos.html">Términos</a><a href="./libro-reclamaciones.html">Libro de Reclamaciones</a>'
          s = s.replace(old, new)
          needle = '<meta property="og:image" content="https://leo556677.github.io/impulso-digital-landing/img/logo-impulso-digital.png?v=20260902-3" />'
          extra = needle + '\n  <meta property="og:image:secure_url" content="https://leo556677.github.io/impulso-digital-landing/img/logo-impulso-digital.png?v=20260902-3" />\n  <meta property="og:image:type" content="image/png" />'
          if 'og:image:secure_url' not in s:
              s = s.replace(needle, extra)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: usar GitHub Pages y publicar enlaces legales"
          git push origin main
