name: Update repository homepage

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Update repository Website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" -f homepage='https://leo556677.github.io/impulso-digital-landing/'
