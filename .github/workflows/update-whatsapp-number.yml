name: Actualizar WhatsApp Impulso Digital

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update-number:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reemplazar numero anterior en todo el sitio
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '51910838451': '51903396082',
              '+51 910 838 451': '+51 903 396 082',
              '910 838 451': '903 396 082',
              '910838451': '903396082',
          }
          allowed = {'.html','.js','.md','.txt','.csv','.yml','.yaml','.xml','.css'}
          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in allowed:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = s
              for old, value in replacements.items():
                  new = new.replace(old, value)
              if new != s:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          print('Archivos modificados:')
          print('\n'.join(changed) if changed else 'Ninguno')

          old_patterns = tuple(replacements.keys())
          leftovers = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in allowed:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for old in old_patterns:
                  if old in s:
                      leftovers.append(f'{p}: {old}')
          if leftovers:
              raise SystemExit('Quedaron referencias antiguas:\n' + '\n'.join(leftovers))
          PY

      - name: Commit y push
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No habia referencias antiguas por cambiar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "contacto: actualizar WhatsApp a +51 903 396 082"
          git push origin main
