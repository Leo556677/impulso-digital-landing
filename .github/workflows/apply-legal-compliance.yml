name: Apply legal compliance fixes

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply legal and privacy fixes
        run: |
          python .github/scripts/apply_legal_compliance.py
          sed -i 's|./#preferencias-analitica|./#privacy-preferences|g' privacidad.html
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Leo556677@users.noreply.github.com"
          git add index.html script.js brand-assets.css privacidad.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "legal: cerrar preferencias de analítica"
            git push
          fi
