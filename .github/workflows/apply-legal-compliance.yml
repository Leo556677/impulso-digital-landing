name: Apply legal compliance fixes

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply legal and privacy fixes
        run: python .github/scripts/apply_legal_compliance.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js brand-assets.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "legal: aviso del libro y preferencias de analítica"
            git push
          fi
