name: Finalize legal trust signals

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add RUC and visible claims notice
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<footer class="site-footer"><div class="container footer-grid">'
          notice = '<section class="container" style="padding:0 0 24px"><a href="./libro-reclamaciones.html" style="display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;text-decoration:none;border:1px solid #e7e7ee;border-radius:18px;padding:18px 20px;background:#fff;color:#171922"><span><strong style="display:block;color:#E6007E">LIBRO DE RECLAMACIONES</strong><span style="font-size:.92rem">Registra aquí tu reclamo o queja</span></span><span aria-hidden="true" style="font-weight:800">Abrir →</span></a></section><footer class="site-footer"><div class="container footer-grid">'
          if 'Registra aquí tu reclamo o queja' not in s:
              s = s.replace(old, notice)
          old2 = '<div class="container footer-bottom"><span>© <span id="year"></span> Impulso Digital</span><span>Perú</span></div>'
          new2 = '<div class="container footer-bottom"><span>© <span id="year"></span> Impulso Digital · RUC 10704415376</span><span>Perú</span></div>'
          s = s.replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "legal: mostrar RUC y aviso del Libro de Reclamaciones"
          git push origin main
