name: Refine cards and information tooltips

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Refine service cards, plans and tooltips
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Libro de Reclamaciones: quitar el bloque promocional grande; se conserva el enlace normal del footer.
          import re
          s = re.sub(
              r'\n\s*<section class="container" style="padding:0 0 24px"><a href="\./libro-reclamaciones\.html".*?</a></section><footer class="site-footer">',
              '\n\n  <footer class="site-footer">',
              s,
              count=1,
              flags=re.S,
          )

          # 2) Añadir símbolo SVG profesional de información al sprite.
          marker = '<symbol id="icon-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>'
          info_symbol = marker + '\n    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10.5v6M12 7.5h.01"/></symbol>'
          if 'id="icon-info"' not in s:
              s = s.replace(marker, info_symbol)

          # 3) Etiquetas comerciales en ubicación estratégica dentro de cada tarjeta principal.
          tops = {
              '<div class="service-body"><span class="service-kicker">IMPULSO WEB</span>': '<div class="service-body"><div class="service-topline"><span class="service-kicker">IMPULSO WEB</span><span class="service-billing-chip">PAGO ÚNICO</span></div>',
              '<div class="service-body"><span class="service-kicker">IMPULSO MARCA</span>': '<div class="service-body"><div class="service-topline"><span class="service-kicker">IMPULSO MARCA</span><span class="service-billing-chip">PAGO ÚNICO</span></div>',
              '<div class="service-body"><span class="service-kicker">IMPULSO SOCIAL</span>': '<div class="service-body"><div class="service-topline"><span class="service-kicker">IMPULSO SOCIAL</span><span class="service-billing-chip">PACK 6</span></div>',
              '<div class="service-body"><span class="service-kicker">IMPULSO AGENDA</span>': '<div class="service-body"><div class="service-topline"><span class="service-kicker">IMPULSO AGENDA</span><span class="service-billing-chip">IMPLEMENTACIÓN</span></div>',
          }
          for old, new in tops.items():
              s = s.replace(old, new)

          price_replacements = {
              '<div class="price-line">Desde <strong>S/790</strong><small>pago único</small></div>': '<div class="price-line">Desde <strong>S/790</strong></div>',
              '<div class="price-line">Desde <strong>S/590</strong><small>pago único</small></div>': '<div class="price-line">Desde <strong>S/590</strong></div>',
              '<div class="price-line">Desde <strong>S/420</strong><small>pack de 6</small></div>': '<div class="price-line">Desde <strong>S/420</strong></div>',
              '<div class="price-line"><strong>S/790</strong><small>implementación</small></div>': '<div class="price-line"><strong>S/790</strong></div>',
          }
          for old, new in price_replacements.items():
              s = s.replace(old, new)

          # 4) Icono de información + explicación humana para cada inclusión de servicios/planes.
          explanations = {
              'Hasta 6 bloques': 'Puedes organizar la página en hasta 6 partes principales, por ejemplo: inicio, quiénes somos, servicios, beneficios, preguntas y contacto.',
              'Celular y computadora': 'La página se adapta para que pueda leerse y utilizarse correctamente tanto desde un teléfono como desde una computadora.',
              'WhatsApp y redes': 'Incluimos accesos claros para que tus visitantes puedan escribirte por WhatsApp o ir a tus redes sociales.',
              'Formulario sencillo cuando corresponda': 'Si tu proyecto lo necesita, podemos añadir un formulario básico para que una persona deje sus datos o una consulta.',
              '2 rondas de cambios': 'Después de la primera propuesta puedes pedir ajustes en dos momentos acordados, dentro del alcance contratado.',
              'Hasta 10 bloques': 'Permite una página más completa, con hasta 10 secciones para explicar mejor tu negocio y tus servicios.',
              'Más servicios o categorías': 'Hay más espacio para mostrar varias líneas de servicio o tipos de atención sin amontonarlos en una sola sección.',
              'Preguntas frecuentes y proceso': 'Podemos explicar las dudas habituales de tus clientes y mostrar paso a paso cómo trabajas o cómo contratarte.',
              'Galería cuando corresponda': 'Si tienes imágenes útiles, se puede incluir una sección visual para mostrar trabajos, productos, instalaciones o resultados permitidos.',
              '3 rondas de cambios': 'Después de la propuesta puedes solicitar ajustes en tres momentos acordados, siempre dentro del alcance contratado.',
              '2 conceptos iniciales': 'Recibes dos caminos visuales diferentes para elegir cuál representa mejor a tu negocio antes de continuar.',
              'Logo principal': 'Es la versión central de tu logotipo: la que se utilizará como referencia principal de tu marca.',
              'Variantes básicas digitales': 'Preparamos versiones útiles del logo para distintos fondos o espacios digitales, según lo que realmente necesite el proyecto.',
              'Archivos finales de uso común': 'Recibes archivos preparados para usos habituales en redes, web o documentos. Los editables especiales se acuerdan por separado.',
              'Logo': 'Incluye el diseño del identificador principal de tu marca para que sea reconocible y consistente.',
              'Paleta de colores': 'Definimos los colores principales que ayudarán a que todas tus piezas se vean como parte de la misma marca.',
              'Tipografías recomendadas': 'Te indicamos qué estilos de letra usar para títulos y textos para mantener una imagen coherente.',
              'Variantes necesarias': 'Adaptamos el logo a los usos digitales acordados para que funcione bien en distintos espacios.',
              'Miniguía de identidad': 'Recibes una guía breve y práctica con reglas simples para usar correctamente logo, colores y tipografías.',
              'Aplicación visual básica': 'Mostramos cómo se aplica la identidad en una pieza o contexto básico para que tengas una referencia clara de uso.',
              'Diseño asistido': 'La pieza se desarrolla con herramientas de diseño asistido, dirección visual y revisión antes de entregarse.',
              'Material del cliente': 'Utilizamos fotos, logos, productos o información que nos proporciones cuando formen parte del trabajo acordado.',
              'Formato acordado': 'Antes de diseñar definimos en qué formato se entregará la pieza, por ejemplo feed, historia o formato vertical.',
              'Piezas listas para publicar': 'Las piezas se entregan exportadas en el formato acordado para que puedas utilizarlas directamente.',
              'Mayor volumen de contenido': 'Tienes más piezas para cubrir más publicaciones o necesidades visuales dentro del periodo que organices.',
              'Mayor continuidad visual': 'El volumen permite mantener durante más tiempo una línea gráfica consistente en tus publicaciones.',
              'Impulso Marca': 'Incluye la solución de identidad visual de Impulso Digital: logo, colores, tipografías y una guía práctica de uso.',
              'Impulso Web Plus': 'Incluye la landing más completa de nuestra oferta web, con más espacio para explicar servicios, beneficios y contacto.',
              '6 creativos': 'Incluye seis piezas visuales creadas para los formatos acordados de tus redes.',
              '12 creativos': 'Incluye doce piezas visuales para tener una mayor continuidad de contenido en redes.',
              'Sin mensualidad obligatoria': 'Este paquete no añade una cuota mensual obligatoria por los servicios incluidos aquí.',
              'Implementación de Agenda': 'Incluye la configuración inicial del sistema de citas y seguimiento según el alcance explicado de Impulso Agenda.',
              'Agenda: S/149/mes': 'La mensualidad corresponde únicamente a la continuidad de Impulso Agenda, no a todos los servicios del paquete.',
              'Agendar una o más citas': 'Permite registrar una o varias citas de un cliente para mantener su atención organizada.',
              'Confirmar, editar y cancelar': 'Puedes actualizar el estado de una cita, cambiarla o cancelarla cuando sea necesario.',
              'Enviar recordatorios': 'El sistema ayuda a preparar el flujo de recordatorios para reducir olvidos y mantener al cliente informado.',
              'Registrar precios': 'Puedes guardar el precio de los servicios utilizados para tener mejor control de la atención.',
              'Contabilizar servicios': 'Permite saber cuántos servicios se han registrado dentro del sistema.',
              'Panel del negocio': 'Reúne información útil de la operación para verla de forma más ordenada en un solo lugar.',
              'Cliente más frecuente': 'Ayuda a identificar qué cliente aparece más veces en tus registros de atención.',
              'Cliente que más invirtió': 'Permite identificar qué cliente acumula el mayor gasto registrado en los servicios.',
              'Servicio más frecuente e ingresos': 'Muestra qué servicio se registra con mayor frecuencia y ayuda a revisar los ingresos asociados.',
              'Historial y gasto por cliente': 'Permite revisar citas anteriores y el gasto registrado de cada cliente para tener contexto al atenderlo.',
          }

          def with_info(text, tip):
              safe_tip = escape(tip, quote=True)
              return (f'<li><span class="feature-text">{text}</span>'
                      f'<span class="info-tip" tabindex="0" role="img" aria-label="Información: {safe_tip}" data-tip="{safe_tip}">'
                      f'<svg aria-hidden="true"><use href="#icon-info"></use></svg></span></li>')

          for text, tip in explanations.items():
              s = s.replace(f'<li>{text}</li>', with_info(text, tip))

          p.write_text(s, encoding='utf-8')

          # 5) Refinamiento visual como override al final de la capa de marca.
          css_path = Path('brand-assets.css')
          css = css_path.read_text(encoding='utf-8')
          marker_css = '/* ---------- UX REFINEMENT 2026-09-02 V2 ---------- */'
          refinement = r'''

/* ---------- UX REFINEMENT 2026-09-02 V2 ---------- */
/* Tarjetas principales: lectura más cómoda y etiquetas comerciales estratégicas */
.service-topline {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:.55rem;
}
.service-billing-chip {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:28px;
  padding:.35rem .65rem;
  border-radius:999px;
  color:#E6007E;
  background:#fff1f7;
  border:1px solid rgba(230,0,126,.14);
  font-size:.66rem;
  font-weight:900;
  letter-spacing:.07em;
  white-space:nowrap;
}
.service-body { padding:1.55rem 1.45rem 1.65rem !important; }
.service-kicker { font-size:.76rem !important; }
.service-body h3 {
  font-size:1.42rem !important;
  line-height:1.2;
  margin:.55rem 0 .72rem !important;
}
.service-body p {
  color:#555861 !important;
  font-size:.96rem !important;
  line-height:1.72 !important;
  text-align:justify;
  text-justify:inter-word;
  hyphens:auto;
  min-height:150px !important;
}
.price-line {
  display:flex;
  align-items:baseline;
  gap:.35rem;
  margin:1.1rem 0 .8rem !important;
  color:#6a6b72;
  font-size:.92rem !important;
}
.price-line strong { font-size:1.9rem !important; line-height:1; }
.monthly-note {
  display:inline-flex;
  align-items:center;
  min-height:30px;
  padding:.38rem .68rem;
  margin:.05rem 0 .72rem !important;
  border-radius:999px;
  background:linear-gradient(135deg,rgba(230,0,126,.09),rgba(255,106,0,.11));
  color:#E6007E !important;
  font-size:.8rem !important;
  font-weight:900 !important;
}
.service-cta { min-height:50px !important; font-size:.95rem !important; }

/* Comparativas: tipografía mayor + recomendado realmente protagonista */
.detail-heading h3 { font-size:2rem !important; }
.detail-heading p { font-size:.97rem; line-height:1.65; }
.compare-band { font-size:.94rem !important; min-height:94px !important; }
.compare-price { font-size:3.55rem !important; }
.compare-card > small {
  align-self:center;
  min-height:auto !important;
  padding:.38rem .72rem;
  border-radius:999px;
  background:#f4f4f7;
  color:#666871 !important;
  font-size:.77rem !important;
  font-weight:800;
  letter-spacing:.04em;
}
.compare-card li,
.agenda-features li {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.7rem;
  overflow:visible;
  font-size:.95rem !important;
  line-height:1.5;
}
.feature-text { flex:1 1 auto; min-width:0; }
.compare-card.recommended {
  min-height:540px !important;
  transform:translateY(-28px) scale(1.045) !important;
  border:3px solid transparent !important;
  background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#E6007E,#F2385A,#FF6A00) !important;
  background-origin:border-box !important;
  background-clip:padding-box,border-box !important;
  box-shadow:0 34px 84px rgba(230,0,126,.24),0 0 0 8px rgba(230,0,126,.045) !important;
}
.compare-card.recommended .compare-band {
  min-height:108px !important;
  font-size:1.03rem !important;
  box-shadow:0 14px 28px rgba(230,0,126,.18);
}
.compare-card.recommended .compare-price {
  color:#E6007E !important;
  font-size:3.9rem !important;
}
.recommend-badge {
  top:-24px !important;
  min-width:188px !important;
  padding:.66rem 1rem !important;
  font-size:.77rem !important;
  letter-spacing:.11em !important;
  background:linear-gradient(135deg,#262626 0%,#3d3d3f 100%) !important;
  border:2px solid #fff;
  box-shadow:0 12px 30px rgba(38,38,38,.24) !important;
}
.recommend-badge::before {
  content:'';
  display:inline-block;
  width:8px;
  height:8px;
  margin-right:.5rem;
  border-radius:50%;
  background:linear-gradient(135deg,#E6007E,#FF6A00);
  vertical-align:middle;
}
.package-card-new.recommended { min-height:565px !important; }

/* Icono SVG i con explicación clara: hover en PC, foco/tap en móvil */
.info-tip {
  position:relative;
  flex:0 0 24px;
  width:24px;
  height:24px;
  display:inline-grid;
  place-items:center;
  border-radius:50%;
  color:#E6007E;
  background:#fff1f7;
  border:1px solid rgba(230,0,126,.20);
  cursor:help;
  outline:none;
  z-index:8;
}
.info-tip svg {
  width:15px;
  height:15px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.info-tip::after {
  content:attr(data-tip);
  position:absolute;
  right:-8px;
  bottom:calc(100% + 11px);
  width:min(280px,72vw);
  padding:12px 14px;
  border-radius:14px;
  background:#262626;
  color:#fff;
  font-size:.78rem;
  font-weight:600;
  line-height:1.48;
  text-align:left;
  box-shadow:0 16px 36px rgba(38,38,38,.24);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateY(6px);
  transition:opacity .18s ease,transform .18s ease,visibility .18s ease;
  z-index:60;
}
.info-tip::before {
  content:'';
  position:absolute;
  right:6px;
  bottom:calc(100% + 4px);
  border:7px solid transparent;
  border-top-color:#262626;
  opacity:0;
  visibility:hidden;
  transition:opacity .18s ease,visibility .18s ease;
}
.info-tip:hover::after,
.info-tip:focus::after,
.info-tip:hover::before,
.info-tip:focus::before {
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}
.info-tip:focus { box-shadow:0 0 0 4px rgba(230,0,126,.12); }

/* El Libro queda únicamente en el footer; eliminamos el gran espacio previo */
.site-footer { margin-top:60px !important; }
.footer-grid p,.footer-grid a,.footer-grid span { font-size:.86rem !important; line-height:1.55; }
.footer-grid strong { font-size:.98rem; }

@media (max-width:1020px) {
  .compare-card.recommended { transform:none !important; }
}

@media (max-width:760px) {
  .service-body p { min-height:0 !important; font-size:.94rem !important; }
  .service-topline { align-items:flex-start; }
  .service-billing-chip { font-size:.62rem; }
  .carousel-track-mobile > .compare-card.recommended {
    border-width:3px !important;
    box-shadow:0 24px 58px rgba(230,0,126,.22) !important;
  }
  .compare-card li,.agenda-features li { font-size:.93rem !important; }
  .info-tip::after {
    right:50%;
    transform:translate(50%,6px);
    width:min(270px,76vw);
  }
  .info-tip:hover::after,.info-tip:focus::after { transform:translate(50%,0); }
  .info-tip::before { right:5px; }
  .site-footer { margin-top:36px !important; }
}
'''
          if marker_css not in css:
              css += refinement
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Commit refinements
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html brand-assets.css
          git commit -m "ui: mejorar tarjetas, recomendado y ayudas contextuales"
          git push origin main
