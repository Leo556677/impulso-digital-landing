name: Refine cards and information tooltips

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply approved refinements
        run: python .github/scripts/refine_cards.py
      - name: Commit refinements
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html brand-assets.css
          git commit -m "ui: mejorar tarjetas, recomendado y ayudas contextuales"
          git push origin main
