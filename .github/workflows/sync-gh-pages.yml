name: Sync Impulso Digital to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages-sync"
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare GitHub Pages site
        run: |
          rm -rf /tmp/impulso-site
          mkdir -p /tmp/impulso-site
          rsync -av --exclude='.git' --exclude='.github' --exclude='.nojekyll' ./ /tmp/impulso-site/
          touch /tmp/impulso-site/.nojekyll
          sed -i 's#https://impulso-digital-landing.vercel.app#https://leo556677.github.io/impulso-digital-landing#g' /tmp/impulso-site/index.html /tmp/impulso-site/robots.txt /tmp/impulso-site/sitemap.xml

      - name: Configure Odontoellu WhatsApp preview like Dr. Olano
        run: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          import cairosvg

          root = Path('/tmp/impulso-site/odontoellu-demo')
          assets = root / 'assets'
          assets.mkdir(parents=True, exist_ok=True)
          out = assets / 'odontoellu-og-512.png'

          # Dr. Olano usa una imagen social cuadrada PNG 512x512 con su marca.
          # Generamos el mismo formato para Odontoellu, con el isotipo y texto legible.
          svg = '''<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#0758a0"/><stop offset="1" stop-color="#22bfe8"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" fill="#f2fbfe"/>
            <rect x="22" y="22" width="468" height="468" rx="34" fill="#ffffff" stroke="#cfeaf4" stroke-width="2"/>
            <g transform="translate(48 47) scale(1.35)" fill="none" stroke="#20b9df" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 5C8 8 4 17 5 27c1 10 7 16 10 28 2 8 5 12 8 12 4 0 5-12 9-19 4 7 5 19 9 19 4 0 6-5 8-12 3-12 9-18 10-28 1-10-3-19-11-22-7-3-11 2-16 4-5-2-9-7-16-4Z" stroke-width="5"/>
              <path d="M18 16c8-4 19-4 28 1" stroke-width="3" opacity=".45"/>
            </g>
            <text x="144" y="91" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#0a4d8a">Odontoellu</text>
            <text x="145" y="120" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#20b9df">CENTRO ODONTOLÓGICO</text>
            <line x1="48" y1="160" x2="464" y2="160" stroke="#d7edf5" stroke-width="2"/>
            <text x="48" y="208" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#0b5b9b">Profilaxis dental</text>
            <text x="48" y="272" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" fill="#083a6a">Desde S/49</text>
            <text x="48" y="313" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#57728a">Evaluación + profilaxis dental</text>
            <rect x="48" y="349" width="416" height="67" rx="33.5" fill="url(#g)"/>
            <text x="256" y="392" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#ffffff">Solicita tu cita</text>
            <circle cx="62" cy="451" r="12" fill="#e5f7fd"/>
            <path d="M62 442c-5.5 0-10 4.5-10 10 0 7.5 10 17 10 17s10-9.5 10-17c0-5.5-4.5-10-10-10zm0 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8z" transform="translate(0 -4) scale(.65) translate(34 245)" fill="#0b63ae"/>
            <text x="84" y="458" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#0b5b9b">Carabayllo, Lima</text>
          </svg>'''
          cairosvg.svg2png(bytestring=svg.encode('utf-8'), write_to=str(out), output_width=512, output_height=512)
          if out.stat().st_size < 10000:
              raise SystemExit(f'OG PNG unexpectedly small: {out.stat().st_size} bytes')
          print('Odontoellu square social image ready:', out, out.stat().st_size, 'bytes')

          image_url = 'https://leo556677.github.io/impulso-digital-landing/odontoellu-demo/assets/odontoellu-og-512.png?v=20260916-5'
          page_base = 'https://leo556677.github.io/impulso-digital-landing/odontoellu-demo/'

          v7 = root / 'v7.html'
          v8 = root / 'v8.html'
          if v7.exists():
              shutil.copy2(v7, v8)

          for p in [root/'index.html', root/'compartir.html', v7, v8]:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('content="noindex,nofollow"', 'content="noindex,follow,max-image-preview:large"')
              s = re.sub(r'<meta property="og:image" content="[^"]+">', f'<meta property="og:image" content="{image_url}">', s)
              s = re.sub(r'<meta property="og:image:url" content="[^"]+">', f'<meta property="og:image:url" content="{image_url}">', s)
              s = re.sub(r'<meta property="og:image:secure_url" content="[^"]+">', f'<meta property="og:image:secure_url" content="{image_url}">', s)
              s = re.sub(r'<meta property="og:image:type" content="[^"]+">', '<meta property="og:image:type" content="image/png">', s)
              s = re.sub(r'<meta property="og:image:width" content="[^"]+">', '<meta property="og:image:width" content="512">', s)
              s = re.sub(r'<meta property="og:image:height" content="[^"]+">', '<meta property="og:image:height" content="512">', s)
              s = re.sub(r'<meta name="twitter:image" content="[^"]+">', f'<meta name="twitter:image" content="{image_url}">', s)
              s = re.sub(r'<link rel="image_src" href="[^"]+">', f'<link rel="image_src" href="{image_url}">', s)

              marker = '<meta name="theme-color" content="#0758a0">'
              if 'rel="image_src"' not in s and marker in s:
                  s = s.replace(marker, marker + f'\n  <link rel="image_src" href="{image_url}">')
              if 'rel="apple-touch-icon"' not in s and marker in s:
                  icon_tags = marker + '\n  <link rel="icon" type="image/png" href="assets/odontoellu-og-512.png?v=20260916-5">\n  <link rel="apple-touch-icon" href="assets/odontoellu-og-512.png?v=20260916-5">'
                  s = s.replace(marker, icon_tags)

              if p.name == 'v8.html':
                  direct = page_base + 'v8.html'
                  s = re.sub(r'<link rel="canonical" href="[^"]+">', f'<link rel="canonical" href="{direct}">', s)
                  s = re.sub(r'<meta property="og:url" content="[^"]+">', f'<meta property="og:url" content="{direct}">', s)
                  s = s.replace('VERSIÓN VISUAL 0.7', 'VERSIÓN VISUAL 0.8')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Publish gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -av /tmp/impulso-site/ ./
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
          else
            git commit -m "deploy: sincronizar GitHub Pages"
            git push origin gh-pages
          fi
