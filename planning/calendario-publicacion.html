<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendario de publicaciones · Impulso Digital</title>
<link rel="stylesheet" href="strategic-calendar.css?v=20260919-business-switcher-v2">
</head>
<body>
<main class="wrap">
  <header class="executive-head">
    <div class="brandline">
      <a class="back" href="./vista-previa.html?v=20260917-editorial-v1">← Volver al banco editorial</a>
      <span>IMPULSO DIGITAL · ESTRATEGIA DE PUBLICACIÓN</span><label class="calendar-business-switcher" data-calendar-business-switcher><span>Negocio</span><select id="calendarBusinessSwitcher" aria-label="Elegir negocio"><option value="">Cargando negocios…</option></select></label>
    </div>
    <div class="head-row">
      <div>
        <h1>Calendario de publicaciones</h1>
        <p id="weekSubtitle">Cargando semana…</p>
      </div>
      <section id="stats" class="stats" aria-label="Resumen ejecutivo"></section>
    </div>
  </header>

  <section class="hypothesis">
    <div>
      <strong id="strategyName">Cargando estrategia…</strong>
      <span id="strategyText"></span>
    </div>
    <small>Hipótesis estratégica inicial; se ajustará con métricas reales.</small>
  </section>

  <section class="control-row">
    <div class="week-nav" aria-label="Navegación por semanas">
      <button id="prevWeek" class="week-arrow" type="button" aria-label="Semana anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <label>
        <span>Semana</span>
        <select id="weekSelect" aria-label="Elegir semana"></select>
      </label>
      <button id="nextWeek" class="week-arrow" type="button" aria-label="Semana siguiente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
      </button>
      <strong id="weekTitle"></strong>
    </div>

    <div class="strategy-filters" aria-label="Filtros del calendario real">
      <label>Servicio
        <select id="strategyService"><option value="">Todos</option></select>
      </label>
      <label>Estado
        <select id="strategyStatus"><option value="">Todos</option></select>
      </label>
      <label class="strategy-search">Buscar por palabra clave
        <input id="strategySearch" type="search" placeholder="Ej. poros, papada, evaluacion…" autocomplete="off">
      </label>
      <span id="strategyResultCount"></span>
      <button id="strategyReset" type="button">Quitar filtros</button>
    </div>
  </section>

  <section id="calendarApp" class="week">
    <div class="loading">Cargando calendario estratégico…</div>
  </section>

  <section id="dayDetail" class="day-detail" hidden></section>

  <footer class="footer">Impulso Digital · Segunda Capa · Publicación real</footer>
</main>
<script type="module" src="strategic-calendar.js?v=20260919-business-switcher-v2"></script>
</body>
</html>
